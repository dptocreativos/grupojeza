<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isla Margarita | Franquicias Grupo Jeza</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Estilos para la página, puedes incluirlos o importarlos desde un archivo CSS */
  </style>
</head>
<body>




<div style="display: flex; height: 100vh; font-family: Montserrat, sans-serif;">

  <!-- Columna 1: Menú lateral -->

<script>
		// Paso 1: Verificar si está logueado
		if (localStorage.getItem('loggedIn') !== 'true') {
		  const currentUrl = window.location.pathname.split('/').slice(2).join('/');
		  window.location.href = '/franquicias/login.html?redirect=' + currentUrl;
		} else {
		  // Paso 2: Mostrar nombre y foto de perfil
		  document.addEventListener('DOMContentLoaded', () => {
			const nombre = localStorage.getItem('nombreUsuario');
			const foto = localStorage.getItem('fotoUsuario');
	
			const perfilHTML = `
			  <div style="display: flex; align-items: center; gap: 12px; background: #f5f5f5; padding: 10px 20px; border-radius: 8px; max-width: 300px;">
				<img src="${foto}" alt="Foto de perfil" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;">
				<div style="font-family: Montserrat, sans-serif;">
				  <div style="font-size: 16px; font-weight: 600;">Hola, ${nombre}</div>
				  <a href="#" onclick="logout()" style="font-size: 12px; color: #007bff; text-decoration: none;">Cerrar sesión</a>
				</div>
			  </div>
			`;
	
			document.getElementById('perfil').innerHTML = perfilHTML;
		  });
		}
	
		// Función para cerrar sesión
		function logout() {
		  localStorage.clear();
		  window.location.href = '/franquicias/login.html';
		}
	  </script>


   <div id="perfil" style="margin: 30px;"></div>
  <div style="width: 80px; background-color: #111827; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px;">
    <!-- Ejemplo de botones -->
    <button style="background: none; border: none; color: white; cursor: pointer;">🏠</button>
    <button style="background: none; border: none; color: white; cursor: pointer;">📄</button>
    <button style="background: none; border: none; color: white; cursor: pointer;">⚙️</button>
    <button style="background: none; border: none; color: white; cursor: pointer;">🚪</button>
  </div>

  <!-- Columna 2: Contenido principal -->
  <div style="flex-grow: 1; background-color: #f9fafb; padding: 40px; overflow-y: auto;">
    <h1>Bienvenido a la página de Isla Margarita</h1>
<p>Este es el contenido protegido que solo puede ser visto por usuarios autenticados.</p>
    <!-- Puedes seguir agregando aquí todo lo que necesites -->
  </div>

</div>
  
  
    
   
    
    <!-- Aquí va el contenido que quieres que vean solo los usuarios logueados -->
  </div>


</body>
</html>
