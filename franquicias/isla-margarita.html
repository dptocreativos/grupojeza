<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isla Margarita | Franquicias Grupo Jeza</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #ddd;
      gap: 10px;
    }

    .logo {
      height: 50px;
    }

    .content {
      padding: 20px 30px 30px 30px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
    }

    /* Para pantallas grandes */
    @media (min-width: 770px) {
      .header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .content {
        padding: 20px 50px 40px 50px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://static.grupojeza.com/branding/LOGO%20GRUPO%20JEZA%20LETRAS%20NEGRAS%20(1).png" alt="Logo Grupo Jeza" class="logo">
    <div id="perfil"></div>
  </div>

  <div class="content">
    <h1>Solicitud de cotización para Isla Margarita - Venezuela</h1>
    <p>Diligencie el formulario a continuación y en un periodo máximo de 48 a 72 horas hábiles le estará llegando a su correo de franquicia la cotización.</p>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');
</style>

<form action="https://formsubmit.co/davidmolerod3@gmail.com" method="POST" style="font-family: 'Montserrat', sans-serif; max-width: 500px; width: 100%;">


  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>Correo electrónico Franquicia</b>b></label>
  <input type="email" name="Correo electrónico Franquicia" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>Nombre del Cliente</b>b></label>
  <input type="text" name="Nombre del Cliente" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>Correo electrónico del Cliente</b>b></label>
  <input type="email" name="Correo electrónico del Cliente" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>WhatsApp del Cliente</b>b></label>
  <input type="text" name="WhatsApp de Cliente" required style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>Instagram del Cliente</b>b></label>
  <input type="text" name="Instagram del Cliente" required style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>¿Éste cliente solicita VIAJE PROGRAMADO o VIAJE A LA MEDIDA?<b></label>
  <input type="text" name="¿Éste cliente solicita VIAJE PROGRAMADO o VIAJE A LA MEDIDA?" required style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>Cantidad de Adultos</b>b></label>
  <input type="text" name="Cantidad de Adultos" required style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">

  <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #222;"><b>Cantidad de Niños/b> (indicar las edades). En caso de no haber niños, dejar en blanco.</label>
  <input type="text" name="Cantidad de Niños" required style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">



  
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="https://tusitio.com/gracias.html">

  <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #5A67D8; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.3s;">
    Enviar
  </button>
</form>


    
  </div>

  

  <script>
    // Paso 1: Verificar si está logueado
    if (localStorage.getItem('loggedIn') !== 'true') {
      const currentUrl = window.location.pathname.split('/').slice(2).join('/');
      window.location.href = '/franquicias/login.html?redirect=' + currentUrl;
    } else {
      // Paso 2: Mostrar nombre y foto de perfil
      document.addEventListener('DOMContentLoaded', () => {
        const nombre = localStorage.getItem('nombreUsuario');
        const foto = localStorage.getItem('fotoUsuario');

        const perfilHTML = `
          <div style="display: flex; align-items: center; gap: 12px; background: #f5f5f5; padding: 10px 20px; border-radius: 8px;">
            <img src="${foto}" alt="Foto de perfil" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;">
            <div style="font-family: Montserrat, sans-serif;">
              <div style="font-size: 16px; font-weight: 600;">Hola, ${nombre}</div>
              <a href="#" onclick="logout()" style="font-size: 12px; color: #007bff; text-decoration: none;">Cerrar sesión</a>
            </div>
          </div>
        `;

        document.getElementById('perfil').innerHTML = perfilHTML;
      });
    }

    // Función para cerrar sesión
    function logout() {
      localStorage.clear();
      window.location.href = '/franquicias/login.html';
    }
  </script>

</body>
</html>
