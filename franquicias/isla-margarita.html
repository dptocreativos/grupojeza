<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destino Isla Margarita | Franquicias Grupo Jeza</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Estilos para la página, puedes incluirlos o importarlos desde un archivo CSS */
  </style>
</head>
<body>

  <!-- Contenido de la página Isla Margarita -->
  <div class="content">
    <h1>Bienvenido a la página de Isla Margarita</h1>
    <p>Este es el contenido protegido que solo puede ser visto por usuarios autenticados.</p>
    <!-- Aquí va el contenido que quieres que vean solo los usuarios logueados -->
  </div>

<script>
  // Verificación de login
  if (localStorage.getItem('loggedIn') !== 'true') {
    // Obtener la URL de la página actual y pasar solo la parte relativa
    const currentUrl = window.location.pathname.split('/').slice(2).join('/');
    
    // Redirigir al login con la URL relativa como parámetro
    window.location.href = '/franquicias/login.html?redirect=' + currentUrl;
  }
</script>
